# Bill of materials for third-party web assets that are cached locally. These
# are processed by build.rs and provided as static files.
#
# `sha384` is the Subresource-Integrity hash (base64, the part after `sha384-`).
# Regenerate one with: openssl dgst -sha384 -binary FILE | openssl base64 -A

