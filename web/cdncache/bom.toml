sha384 = "QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
served_as = "npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

[[asset]]
sources = ["https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"]
