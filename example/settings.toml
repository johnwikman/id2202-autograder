name = "ID2202 Autograder"

# Note: All paths are relative to this file, not where the binary is being run from.

# Logging settings
[log]
dir = "./data/logs" # where to place generated logs
verbose = false     # whether to output debug messages

# Entrypoint monitor process settings
[monitor]
poll_interval_seconds = 30

# General purpose timeout settings
[timeout]
notify_poll_millisec = 5000
http_send_millisec = 5000
fs_write_seconds = 10 # before giving up on a file system write

# Configuration for incoming submissions
[submission]
max_tag_length = 128
max_payload = 65536
comment_signature = "(_This is an automated response from the autograder_ \U0001F916)"

# Information about GitHub instances that can submit grading jobs
[submission.github]
webhook_secret = "s3cr3t"

# Known GitHub servers that we can accept requests from. Uncomment this when
# performing integration testing against GitHub instances.
#[[submission.github.known_instances]]
#domain = "gits-15.sys.kth.se"
#outbound_host = ""
#ssh_port = 22
#ssh_user = "git"
#auth_token = "ChangeMe"
#allowed_orgs = ["ID2202-jwikman-test"]
#allowed_repo_prefixes = ["id2202-"]
#allowed_repo_suffixes = []
#prohibited_repo_prefixes = []
#prohibited_repo_suffixes = ["-shadow"]

# Information about GitLab instances that can submit grading jobs
[submission.gitlab]
webhook_secret = "s3cr3t"

# Known GitLab instances that we can accept requests from
[[submission.gitlab.known_instances]]
domain = "localhost:8929"
outbound_host = ""   # if empty, the host of `domain` is used
ssh_port = 2424
ssh_user = "git"
auth_token = "ChangeMe"
allowed_namespaces = ["id2202-test", "autograder-testing"]
allowed_repo_prefixes = ["id2202-"]
allowed_repo_suffixes = []
prohibited_repo_prefixes = []
prohibited_repo_suffixes = []
use_https = false

# Configuration for direct submission requests
[submission.direct]
secret = "s3cr3t"
storage_dir = "./data/direct-submissions"
max_unpacked_size = 4_194_304 # Maximum size of direct submissions (4 MiB)
allowed_domains = ["localhost:5000"]

# Postgres configuration
[postgres]
user = "autograder"
password = "ChangeMe"
host = "127.0.0.1"
port = 5432

# Server-specific configuration
[server]
address = "127.0.0.1" # this only works outside containers
port = 8080

# Secrets that allow external entities to access information
[server.secrets]
api_auth_tokens = []

# Runner-specific configuration
[runner]
n_runners = 4
database_poll_interval_seconds = 10

workspace_dir = "./data/workspace" # storage for data currently being worked on
shadow_dir = "./data/shadow"       # storage for submitted solutions
test_config = "./tests/tests.toml" # configuration for test cases

ssh_keys = []                              # empty means the default SSH configuration
ssh_known_hosts = "./data/ssh/known_hosts" # host keys of the submission sources

[runner.podman]
network_prefix = "id2202_runnernet"

# This must be able to be fetched, no build info provided
[runner.podman.images.default]
image = "docker.io/johnwikman/id2202:0.3.0"
tmpdir = "/tmp"
mount_code = "/id2202/solution"
mount_tests = "/id2202/tests"

# This can be built since it has "build" specified
[runner.podman.images.verifier]
image = "localhost/id2202-autograder-verifier:latest"
tmpdir = "/tmp"
build = {path = "../container/verifier", file = "Containerfile"}
mount_code = "/id2202/verifiers"
mount_tests = "/id2202/tests"

[reporting]
shown_failures = 3 # Number of failed tests that should be revealed to the user.

# Settings for markdown output during reporting.
[reporting.markdown]
symbol_ok = "\u2705"             # ✅
symbol_skipped = "\u2753"        # ❓
symbol_failed = "\u274C"         # ❌
symbol_tagsuccess = "\U0001F389" # 🎉
symbol_build = "\U0001F6A7"      # 🚧
symbol_waiting = "\u23F3"        # ⏳
symbol_voided = "\u26A0\uFE0F"   # ⚠️
show_indicator_submission_header = false
show_indicator_tag_header = true
truncate_len = 2000
