# Default values
[default.tag]
timeout_total = 1200 # Timeout for a tag

[default.build]
srcdir = "."
cmd = ["make"]
timeout = 60         # Timeout for building the project
max_output = 4194304 # Maximum length of captured output (4 MiB)
prohibit_binary_files = true
allowed_binary_files = ["regalloc.pdf", "liveness.pdf"]
allowed_binary_mimetypes = [
    "application/pdf",
    "application/javascript",
    "application/json",
]

[default.test]
timeout = 60         # Timeout for a single test case
max_output = 4194304 # Maximum length of captured output (4 MiB)
kind = "run"         # Default test kind to use

# Default configuration for test kinds
# (These can be overidden by specific tests, if you want the compilation
# process to fail, etc.)
[default.test.kinds.run]
bin = "cigrid"
args = []
stdin_ignore = true
code = [0]
stdout = []
stdout_trim = true
stdout_strip_whitespace = false
stderr = []
stderr_trim = true
stderr_strip_whitespace = false
input_files = []
auto_input_files = [".cpp"]

[default.test.kinds.run_verifier]
bin = "cigrid"
args = []
stdin_ignore = true
input_files = []
auto_input_files = [".cpp"]
verifier_path = "path_to_verifier_script"
verifier_params = {}
verifier_param_schema = {}
verifier_timeout = 60

# Note: ASM is generated to stdout. So it will never be ignored
[default.test.kinds.gen_asm_and_run]
bin = "cigrid"
args = ["--asm"]
stdin_ignore = true
code = [0]
stderr = []
stderr_trim = true
stderr_strip_whitespace = false
input_files = []
auto_input_files = [".cpp"]
# Defaults for assembler and compiler. <ASM_FILE> is a template which will be
# replaced with the path to the generated assembly code.
assemble_cmd = ["nasm", "-felf64", "<ASM_FILE>", "-o", "a.o"]
assemble_code = [0]
compile_cmd = ["gcc", "-no-pie", "a.o", "-o", "a.out"]
compile_code = [0]
# Defaults for running the generated binary
run_cmd = ["./a.out"]
run_stdin_ignore = true
run_code = [0]
run_stdout = []
run_stdout_trim = true
run_stdout_strip_whitespace = false
run_stderr = []
run_stderr_trim = true
run_stderr_strip_whitespace = false

[default.test.kinds.check_file_exists]
path = ""
mimetype_prefix_ignore = true

# The test tags are specified below. Note that the source files are built once
# for each tag. Hence all build configuration are specified in this file.
#
# Any configuration on how the tests are run can be customly specified for each
# test case.
#
# A tag may contain arbitrary metadata fields or none at all. These are opaque
# to the autograder, and are just treated as some serializable field that can
# be converted to JSON, TOML, etc. This is useful for external services making
# use of the autograder.
[tags.hello]
dirs = ["hello"]
task_file = "hello/task.md"
build.srcdir = "solutions/hello"
build.cmd = ["make"]
metadata.version = 1

[tags.hello-extra]
dirs = ["hello-extra"]
task_file = "hello-extra/task.adoc"
build.srcdir = "solutions/hello-extra"
build.cmd = ["make"]
metadata.version = 2
metadata.date = "2026-01-30"

[tags.hello-extra-more]
extends = "hello-extra"
dirs = ["hello-extra-more"]
task_file = "hello-extra-more/task.adoc"
metadata.version = 1
metadata.date = "2026-07-30"

[tags.hello-asm]
dirs = ["hello-asm"]
build.srcdir = "solutions/hello-asm"
build.cmd = ["make"]
metadata.version = 1
metadata.optional = true

[tags.hello-file]
dirs = ["hello-file"]
build.srcdir = "solutions/hello-file"
build.cmd = ["make"]

# "Alias" tags which can be used to run invoke multiple tags
# (Intentionally excluded `hello-extra-more` here.)
[tag_groups]
hello-all = ["hello", "hello-extra", "hello-asm", "hello-file"]
